name = "obs-5m-mcp"
main = "src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# unfoldingWord Cloudflare account
account_id = "5a3ffd86280d3ed086be76d955829242"

# The website (npm run build:web → web/dist). The Worker answers /mcp and /api first.
[assets]
directory = "web/dist"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "OBS_5M_CACHE"
id = "dbce5945a6d145c58fe6c5ac69dba073"
preview_id = "57e62549ea044792b846c86c024fa661"

# Enable R2 in the Cloudflare dashboard, then uncomment:
#   npx wrangler r2 bucket create obs-5m-mcp-assets
# [[r2_buckets]]
# binding = "ASSETS_BUCKET"
# bucket_name = "obs-5m-mcp-assets"

[[durable_objects.bindings]]
name = "MCP_AGENT"
class_name = "Obs5mMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Obs5mMCP"]

[vars]
PUBLIC_BASE_URL = "https://obs-5m-mcp.unfoldingword.workers.dev"
# RATE_LIMIT_RPM = "90"   # optional; default 90 when unset. Set "0" to disable.
# MCP_API_KEY is a wrangler secret (not a plaintext var) when enabling auth.

# Worker Previews: one isolated copy of the Worker per branch or pull request
# (https://developers.cloudflare.com/workers/previews/). Durable Objects get a
# fresh namespace per preview automatically. The cache uses the separate
# preview KV namespace, so previews never write to the production cache.
[previews.vars]
# Empty: the Worker uses each request's own origin, so a preview links to itself.
PUBLIC_BASE_URL = ""

[[previews.kv_namespaces]]
binding = "OBS_5M_CACHE"
id = "57e62549ea044792b846c86c024fa661"

[[previews.durable_objects.bindings]]
name = "MCP_AGENT"
class_name = "Obs5mMCP"
