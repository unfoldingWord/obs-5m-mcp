name: MCP health check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  smoke:
    if: ${{ vars.WORKER_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: tools/list + fetch_obs_study_manual
        env:
          SMOKE_URL: ${{ vars.WORKER_URL }}
        run: npm run test:smoke
